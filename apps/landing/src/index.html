<!doctype html>
<html lang="en" data-theme="midnight">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Zumi</title>
  <meta name="description" content="Read comics together in XR. Coming soon to Meta Quest 3.">
  <meta property="og:title" content="Zumi">
  <meta property="og:description" content="Read comics together in XR. Coming soon to Meta Quest 3.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Noto+Sans:wght@400;500&display=swap">
  <link rel="stylesheet" href="tokens.css">
  <style>
    /* The library at midnight: blue-black room, one amber lamp, a paper card, Zumi floating. */
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;background:var(--color-room-field);color:var(--color-text-default);font-family:var(--font-family-body);
      display:grid;place-items:center;overflow:hidden;
      padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
    .lamp{position:fixed;inset:0;pointer-events:none;
      background:radial-gradient(60vmax 45vmax at 50% 120%,color-mix(in srgb,var(--color-accent-default) 22%,transparent),transparent 65%)}
    .grain{position:fixed;inset:0;pointer-events:none;opacity:var(--texture-grain-opacity,.05);
      background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}
    main{position:relative;display:grid;justify-items:center;gap:28px;text-align:center;max-width:720px}
    .zumi{width:84px;height:84px;border-radius:50%;position:relative;background:var(--color-mascot-orange);
      box-shadow:0 0 40px color-mix(in srgb,var(--color-accent-default) 45%,transparent),0 0 120px color-mix(in srgb,var(--color-accent-default) 20%,transparent);
      animation:bob 3.2s ease-in-out infinite}
    .zumi::before{content:"";position:absolute;left:27%;top:34%;width:12%;height:14%;border-radius:50%;background:#1a1410;box-shadow:.36em 0 0 #1a1410;font-size:84px}
    .zumi::after{content:"";position:absolute;left:35%;top:58%;width:30%;height:18%;border-radius:0 0 1em 1em;background:#1a1410}
    @keyframes bob{50%{transform:translateY(-8px)}}
    @media (prefers-reduced-motion:reduce){.zumi{animation:none}}
    h1{margin:0;font-family:var(--font-family-display);font-weight:800;font-size:clamp(56px,12vw,120px);line-height:.9;letter-spacing:.02em;text-transform:uppercase}
    h1 small{display:block;font-size:.22em;letter-spacing:.18em;color:var(--color-accent-default);margin-top:14px}
    p{margin:0;max-width:40ch;color:var(--color-text-dim);font-size:var(--font-size-lg);line-height:1.5}
    .badge{display:inline-block;margin-top:8px;line-height:0}
    .badge img{height:56px;width:auto}
    .badge-fallback{display:inline-flex;align-items:center;gap:12px;height:56px;padding:0 22px;border-radius:var(--radius-control);
      background:var(--color-cta-default);color:var(--color-text-onCta);text-decoration:none;
      font-family:var(--font-family-display);font-weight:800;font-size:18px;letter-spacing:.06em;text-transform:uppercase}
    .badge-fallback:hover{background:var(--color-cta-hover)}
    footer{position:fixed;bottom:max(16px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:var(--color-text-faint);font-size:var(--font-size-xs)}
  </style>
</head>
<body>
  <div class="lamp" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>
  <main>
    <div class="zumi" role="img" aria-label="Zumi, the reading companion"></div>
    <h1>Zumi<small>Coming soon</small></h1>
    <p>Read comics together in XR. Sketches become living panels in your room, with voices, sound and friends beside you.</p>
    <!-- Drop Meta's official "Available on Meta Quest" badge at assets/meta-quest-badge.svg (from Meta's brand resources) and set the store URL. -->
    <a class="badge" href="https://www.meta.com/experiences/" rel="noopener" aria-label="Available on Meta Quest">
      <img src="assets/meta-quest-badge.svg" alt="Available on Meta Quest" onerror="this.parentNode.innerHTML='<span class=badge-fallback>Available on Meta Quest</span>'">
    </a>
  </main>
  <footer>© Zumi · A Meta Quest 3 experience</footer>
</body>
</html>
